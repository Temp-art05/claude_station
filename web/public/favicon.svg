<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The prompt on the primary tile: the same tile as the sidebar brand mark in
    AppShell, same two colours (the primary and on-primary tokens from
    index.css), same corner radius as a fraction of the tile, 40%, matching
    `rounded-lg` on `size-10`.

    Deliberately NOT the same glyph. The sidebar draws the whole Material
    Symbols Rounded `terminal` symbol, window frame and all. A browser paints
    this file at 16px, where that frame eats the tile and closes the prompt
    inside it into a smudge, so here only the prompt itself is kept and drawn
    large. Same idea, legible at the size it is actually seen.

    The two subpaths are lifted from
    @material-symbols/svg-400/rounded/terminal-fill.svg, dropping its two frame
    subpaths. The chevron began as `m221-218`, relative to where the inner
    frame left off at (140, -220); with the frame gone it is absolute at
    (361, -438), and the underscore stays relative to it. Their ink spans
    x 269.4 to 710 and y minus 572 to minus 288 on the 960 grid, so centring
    for a scale `s` is translate(16 minus 489.7s, 16 plus 430s) and changing
    the scale means moving the translate to match.

    Keep this comment free of double hyphens: XML forbids them inside comments,
    and a favicon that fails to parse falls back to the browser's blank globe.
  -->
  <rect width="32" height="32" rx="13" fill="#3fd898" />
  <g transform="translate(-7.51 36.64) scale(0.048)" fill="#05261a">
    <path d="M361-438l-83-83q-9-9-8.5-21t9.5-21q9-9 21-9t21 9l104 104q9 9 9 21t-9 21L321-313q-9 9-21 9t-21-9q-9-9-9-21t9-21l82-83Zm159 150q-13 0-21.5-8.5T490-318q0-13 8.5-21.5T520-348h160q13 0 21.5 8.5T710-318q0 13-8.5 21.5T680-288H520Z"/>
  </g>
</svg>
