<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The sidebar logo mark from AppShell: the same primary tile, the same glyph
    (Material Symbols Rounded `terminal`, filled, taken from
    @material-symbols/svg-400/rounded/terminal-fill.svg), and the same corner
    radius as a fraction of the tile, 40%, matching `rounded-lg` on `size-10`.
    The two colours are the primary and on-primary tokens from index.css.

    The glyph is deliberately a touch larger here than in the sidebar (~55% of
    the tile against ~50%): a browser paints this at 16px, and at the sidebar's
    proportion the terminal smears into a blur that size.

    Its own box is 960 units tall on a y axis running from minus 960 to 0, ink
    spanning x 80 to 880 and y minus 800 to minus 160. Centring it for a scale
    `s` is translate(16 minus 480s, 16 plus 480s), so changing the scale means
    moving the translate to match.

    Keep this comment free of double hyphens: XML forbids them inside comments,
    and a favicon that fails to parse falls back to the browser's blank globe.
  -->
  <rect width="32" height="32" rx="13" fill="#3fd898" />
  <g transform="translate(5.5 26.5) scale(0.021875)" fill="#05261a">
    <path d="M140-160q-24 0-42-18t-18-42v-520q0-24 18-42t42-18h680q24 0 42 18t18 42v520q0 24-18 42t-42 18H140Zm0-60h680v-436H140v436Zm221-218-83-83q-9-9-8.5-21t9.5-21q9-9 21-9t21 9l104 104q9 9 9 21t-9 21L321-313q-9 9-21 9t-21-9q-9-9-9-21t9-21l82-83Zm159 150q-13 0-21.5-8.5T490-318q0-13 8.5-21.5T520-348h160q13 0 21.5 8.5T710-318q0 13-8.5 21.5T680-288H520Z"/>
  </g>
</svg>
