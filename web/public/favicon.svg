<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The sidebar logo mark, exactly: the primary tile from AppShell carrying the
    same glyph the app renders in it — Material Symbols Rounded `terminal`,
    filled (@material-symbols/svg-400/rounded/terminal-fill.svg). Hand-drawing
    an approximation of it is what left the tab and the sidebar showing two
    different icons. Colours track --color-primary / --color-on-primary.

    The glyph's own box is 960 units tall on a y axis running -960..0, so it is
    scaled to 24px and dropped at (4, 28) to sit centred in the 32px tile.
  -->
