# Orchestrator–workers: một con điều phối đọc việc rồi phát cho ba con thợ.
#
# Khác `parallel-multi-repo` ở chỗ ai quyết định chia thế nào. Ở kia người viết
# workflow đã chia sẵn (FE/BE/iOS — biết trước). Ở đây KHÔNG biết trước có bao
# nhiêu phần việc, nên step `plan-split` đọc rồi tự chia thành đúng ba lô, và ba
# con thợ nhận lô theo số thứ tự.
#
# Ba là con số cố định vì scheduler chạy theo đồ thị tĩnh: không fan-out động
# được. Đổi lại nó đơn giản và không bao giờ nổ ra hai mươi nhánh. Lô thừa thì
# con điều phối dồn vào ba lô; ít hơn ba thì lô rỗng và thợ báo "không có việc".
#
# Dùng khi: một đống việc con cùng loại, độc lập với nhau, không biết trước bao
# nhiêu — dọn lint toàn repo, sửa 20 chỗ gọi API cũ, viết test cho một thư mục.
# Không dùng khi: các phần phụ thuộc nhau — lúc đó tuần tự đúng hơn và rẻ hơn.
name: orchestrator-tasks
description: >-
  Một con điều phối đọc phạm vi rồi chia thành ba lô độc lập; ba con thợ làm song song trong worktree
  riêng; một con gộp lại và mở PR. Dùng cho nhiều việc con cùng loại, không biết trước số lượng.
folder: auto
inputs:
  - key: scope
    label: Việc cần làm
    type: text
    required: true
    help: 'VD: "đổi mọi chỗ còn gọi API v1 sang v2", "viết test cho thư mục services".'

steps:
  - key: plan-split
    type: agent
    title: Điều phối — khảo sát và chia ba lô
    agentName: fe-dev
    permissionMode: default
    instruction: >-
      Việc: {{scope}}. Khảo sát repo, liệt kê TẤT CẢ chỗ phải chạm (file:line).
      Chia thành đúng ba lô độc lập nhau — hai lô không được sửa cùng một file, vì chúng sẽ chạy
      song song. Lô nào cũng phải tự đứng được: người làm lô 2 không cần biết lô 1 làm gì.
      Ghi ra artifact theo đúng dạng "## Lô 1 / ## Lô 2 / ## Lô 3", mỗi lô là danh sách file + việc.
      Ít hơn ba phần việc thì để lô rỗng và nói rõ là rỗng.

  - key: worker-1
    type: agent
    title: Thợ 1
    agentName: fe-dev
    dependsOn: [plan-split]
    isolate: true
    permissionMode: acceptEdits
    instruction: >-
      Làm **Lô 1** trong artifact của step điều phối. Chỉ chạm file thuộc lô của bạn — file của lô
      khác đang được sửa song song, đụng vào là mất thay đổi của nhau. Lô rỗng thì báo và dừng.

  - key: worker-2
    type: agent
    title: Thợ 2
    agentName: fe-dev
    dependsOn: [plan-split]
    isolate: true
    permissionMode: acceptEdits
    instruction: >-
      Làm **Lô 2** trong artifact của step điều phối. Chỉ chạm file thuộc lô của bạn. Lô rỗng thì
      báo và dừng.

  - key: worker-3
    type: agent
    title: Thợ 3
    agentName: fe-dev
    dependsOn: [plan-split]
    isolate: true
    permissionMode: acceptEdits
    instruction: >-
      Làm **Lô 3** trong artifact của step điều phối. Chỉ chạm file thuộc lô của bạn. Lô rỗng thì
      báo và dừng.

  - key: integrate
    type: agent
    title: Gộp ba lô về một nhánh
    agentName: fe-dev
    dependsOn: [worker-1, worker-2, worker-3]
    permissionMode: acceptEdits
    instruction: >-
      Ba thợ làm trong worktree riêng. Gộp thay đổi của cả ba về nhánh chính của run, xử lý chỗ
      chồng lấn nếu có (đáng lẽ không có — nếu có thì ghi lại, đó là lỗi chia lô).
      Kiểm nhanh rằng ba lô cộng lại đúng là phạm vi ban đầu, không thiếu chỗ nào.

  - key: verify
    type: gate
    title: Test phải xanh
    commandName: Test
    dependsOn: [integrate]
    onFail: integrate
    maxLoops: 2

  - key: pr
    type: agent
    title: Mở PR
    agentName: fe-dev
    dependsOn: [verify]
    permissionMode: acceptEdits
    instruction: >-
      Commit và mở PR. Mô tả: phạm vi ban đầu, ba lô đã chia thế nào, chỗ nào bị bỏ qua và vì sao.
      KHÔNG merge.
