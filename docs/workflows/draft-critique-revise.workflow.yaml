# Evaluator–optimizer: một con viết, một con KHÁC chấm, con đầu sửa.
#
# Đây là biến thể của gate-loop cho loại việc mà máy không chấm được. `gate` đọc
# exit code — tuyệt cho code. Nhưng một bản plan, một mô tả PR, một tài liệu thì
# không có exit code nào cả; thứ gần nhất là một con thứ hai đọc lại theo
# checklist. Quan trọng: phải là con KHÁC. Bảo chính nó tự chấm bài mình thì gần
# như lần nào cũng "đạt".
#
# Vòng lặp ở đây do `condition` điều khiển chứ không phải `gate`: con chấm ghi
# kết luận đạt/chưa vào câu trả lời, và bước sửa chỉ chạy khi chưa đạt.
#
# Dùng khi: đầu ra là chữ và chất lượng đọc mới biết — plan, spec, tài liệu, mô
# tả PR, báo cáo.
# Không dùng khi: có test — dùng gate-loop-impl-test, rẻ hơn và khách quan hơn.
name: draft-critique-revise
description: >-
  Viết → một con khác chấm theo checklist → sửa lại nếu chưa đạt. Dùng cho đầu ra là chữ, chỗ không
  có exit code nào để dựa vào.
folder: auto
inputs:
  - key: task
    label: Viết cái gì
    type: text
    required: true
    help: 'VD: "plan cho feature v1.5", "tài liệu kiến trúc module chat".'
  - key: docs
    label: Tài liệu tham chiếu (tuỳ chọn)
    type: docs

steps:
  - key: draft
    type: agent
    title: Bản đầu
    agentName: fe-dev
    permissionMode: acceptEdits
    instruction: >-
      Viết: {{task}}. Tài liệu tham chiếu (nếu có) đã nằm trong "Tagged sources".
      Viết bản đầu cho xong, đừng đánh bóng — sẽ có con khác chấm và bạn sẽ sửa.
      Lưu bằng workflow_emit_artifact.

  - key: critique
    type: agent
    title: Chấm — con khác đọc lại
    agentName: spec-reader
    dependsOn: [draft]
    permissionMode: default
    instruction: >-
      Đọc bản nháp ở artifact. Chấm theo đúng bốn câu, mỗi câu trả lời có dẫn chứng cụ thể trong bản
      nháp: (1) có chỗ nào nói mà không kiểm được đúng/sai không? (2) có chỗ nào mâu thuẫn với code
      hoặc tài liệu tham chiếu không? (3) thiếu phần nào mà người đọc sẽ phải hỏi lại? (4) có chỗ nào
      dài mà không thêm thông tin không?
      Xong thì gọi workflow_ask đúng một câu: key "verdict", kind "choice",
      options ["đạt", "chưa đạt"], kèm tóm tắt lý do. Đây là phiếu chấm của bạn — đừng nể nang, nhưng
      cũng đừng bắt bẻ chữ nghĩa: chỉ "chưa đạt" khi có thứ thật sự phải sửa.
      Ghi nhận xét chi tiết ra artifact.

  - key: revise
    type: agent
    title: Sửa theo nhận xét
    agentName: fe-dev
    dependsOn: [critique]
    condition: answers.verdict == "chưa đạt"
    permissionMode: acceptEdits
    instruction: >-
      Đọc nhận xét ở artifact rồi sửa bản nháp. Sửa đúng chỗ được chỉ ra — đừng viết lại từ đầu,
      và đừng cãi: chỗ nào bạn cho là nhận xét sai thì ghi một dòng lý do ngay trong bản sửa.
      Lưu bản mới bằng workflow_emit_artifact.
