# Human-in-the-loop: đọc docs, chia task lên Jira, rồi DỪNG.
#
# Mô hình: chèn một cổng người trước bước tốn kém. Ở đây bước tốn kém là impl —
# sửa sai một task chia hỏng rẻ hơn nhiều so với sửa code đã viết theo task hỏng.
#
# Dùng khi: spec mới, chưa tin lắm, hoặc muốn nhìn board trước khi cho chạy tiếp.
# Sau khi xem xong, chạy `ticket-to-pr` cho từng ticket, hoặc chạy thẳng
# `spec-doc-to-delivery` nếu thấy plan ổn.
name: spec-doc-to-tasks
description: >-
  Docs → plan → task trên Jira → dừng cho bạn xem. Không đụng vào code. Dùng khi muốn duyệt cách chia
  task trước khi cho agent impl.
folder: auto
inputs:
  - key: docs
    label: Tài liệu spec (link GitHub)
    type: docs
    required: true
  - key: jiraProject
    label: Jira project
    type: jira-project
    required: true
  - key: jiraTicket
    label: Ticket cha (tuỳ chọn)
    type: jira-ticket

steps:
  - key: read-spec
    type: agent
    title: Soát spec, ra plan
    agentName: spec-reader
    permissionMode: default
    instruction: >-
      Tài liệu {{docs}} đã nằm sẵn trong "Tagged sources". Soát đủ bốn mục (tiêu chí nghiệm thu ·
      bốn trạng thái · API nào · lần này không làm gì), đối chiếu code hiện tại, rồi viết plan.
      Thiếu quá thì dừng và đề nghị trả về PO. Lưu plan bằng workflow_emit_artifact.

  - key: jira-tasks
    type: agent
    title: Tạo task trên Jira
    agentName: jira-pm
    dependsOn: [read-spec]
    permissionMode: acceptEdits
    instruction: >-
      Chia plan thành task xong-là-kiểm-được, tạo trên project {{jiraProject}}
      (subtask dưới {{jiraTicket}} nếu có). Đừng kéo trạng thái gì cả — chưa ai làm.

  - key: review
    type: manual
    title: Xem lại task trên board
    dependsOn: [jira-tasks]
    instruction: >-
      Mở board và đọc lại các task vừa tạo. Ổn thì chạy `ticket-to-pr` cho từng ticket, hoặc
      `spec-doc-to-delivery` cho cả lô. Chưa ổn thì sửa ticket tay rồi chạy tiếp.
