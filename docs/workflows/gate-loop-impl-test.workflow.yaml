# Vòng lặp có máy kiểm: impl → test → fix → test…
#
# Đây là vòng người ta chạy tay nhiều nhất, và cũng là vòng dễ giả nhất: agent
# chạy test, đọc log, rồi tự nói "xong". Ở đây `verify` là một gate — nó đọc exit
# code, đỏ thì đẩy ngược về `impl` kèm log lỗi, và có hai cái chặn: tối đa 3 vòng,
# và dừng ngay khi hai vòng liên tiếp cho ra output y hệt (lúc đó nó đang xoay tại chỗ).
#
# Lint tách riêng để biết hỏng ở đâu: một gate trả về "đỏ" gộp cả test lẫn lint thì
# vòng sửa cứ đi mò.
name: gate-loop-impl-test
description: >-
  Vòng implement → test → fix do scheduler điều khiển, không phải do agent tự nhận định.
  Ba vòng là trần, hai vòng giống hệt nhau thì dừng sớm hơn.
folder: auto
steps:
  - key: impl
    type: agent
    title: Impl (và sửa lại sau mỗi vòng)
    agentName: fe-dev
    permissionMode: acceptEdits
    instruction: >-
      Lần đầu: impl theo goal của run. Các vòng sau: gate đã đỏ — đọc log của command run gần
      nhất bằng read_command_log, tìm nguyên nhân thật rồi sửa. Đừng sửa test cho nó xanh;
      nếu test sai thì nói ra bằng workflow_ask thay vì tự đổi.

  - key: verify-test
    type: gate
    title: Test
    commandName: Test
    dependsOn: [impl]
    onFail: impl
    maxLoops: 3

  - key: verify-lint
    type: gate
    title: Lint
    commandName: Lint
    dependsOn: [verify-test]
    onFail: impl
    maxLoops: 2

  - key: pr
    type: agent
    title: Mở PR
    agentName: fe-dev
    dependsOn: [verify-lint]
    permissionMode: acceptEdits
    instruction: >-
      Commit và mở PR. Mô tả ghi rõ đã qua mấy vòng sửa và vòng cuối sửa cái gì — đó là thông tin
      hữu ích nhất cho người review. KHÔNG merge.
