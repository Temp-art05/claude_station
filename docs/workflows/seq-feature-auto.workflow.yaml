# Tuần tự, chạy không cần duyệt từng bước.
#
# Mô hình cơ bản nhất: mỗi bước chờ bước trước. Thứ khiến nó khác hai workflow cũ
# là bước `verify` — một gate đọc exit code thật, và đỏ thì đẩy ngược về `impl`
# thay vì để agent tự tuyên bố đã xong.
#
# Bật "Run unattended" lúc Start run. Người vẫn giữ hai chỗ: câu hỏi thật của
# agent, và nút merge.
name: seq-feature-auto
description: >-
  Tuần tự + auto: plan → impl → gate(test) → PR. Gate đỏ thì quay lại impl, tối đa 3 vòng.
  Không dừng để duyệt, chỉ dừng khi agent thật sự có câu hỏi.
folder: auto
steps:
  - key: plan
    type: agent
    title: Đọc yêu cầu và lên plan
    agentName: spec-reader
    permissionMode: default
    instruction: >-
      Đọc goal của run này cùng docs/spec liên quan trong Knowledge (dùng knowledge_search,
      đừng đoán). Viết plan ra docs/plans/<feature>.md: mục tiêu, phạm vi, các bước theo thứ tự,
      file dự kiến chạm, edge case. Chỗ nào spec thiếu hoặc mâu thuẫn thì hỏi qua workflow_ask —
      đừng tự bịa. Lưu plan bằng workflow_emit_artifact để bước sau đọc được.

  - key: impl
    type: agent
    title: Impl theo plan
    agentName: fe-dev
    permissionMode: acceptEdits
    maxRetries: 1
    instruction: >-
      Đọc file plan ở artifact của bước trước rồi impl đúng phạm vi đã chốt — không mở rộng.
      Theo chuẩn của repo (CLAUDE.md, lint, kiến trúc). Sửa gì lệch plan thì sửa plan trước.
      Không tự quyết: tiền, đăng nhập, dữ liệu người dùng, quyền, xoá dữ liệu, đổi schema,
      đổi API contract, thêm/đổi thư viện, đổi kiến trúc, sửa script phát hành. Gặp mấy chỗ đó
      thì dừng hỏi bằng workflow_ask.

  - key: verify
    type: gate
    title: Build + test phải xanh
    commandName: Test
    onFail: impl
    maxLoops: 3
    instruction: Exit code quyết định, không phải lời agent.

  - key: pr
    type: agent
    title: Review cuối và mở PR
    agentName: fe-dev
    permissionMode: acceptEdits
    instruction: >-
      Tự soát lại diff theo chuẩn repo, rồi commit và mở PR. Mô tả PR gồm: làm gì, vì sao,
      cách kiểm, và **mọi giả định đã ghi trong run này**. KHÔNG merge — merge là việc của người.
