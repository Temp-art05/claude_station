# Phân nhánh: hỏi một câu ở đầu, rồi đi một trong hai đường.
#
# Bước `route` là chỗ duy nhất dừng lại hỏi. Hai nhánh sau khai `condition` đọc
# chính câu trả lời đó; nhánh không khớp bị đánh `skipped` chứ không phải `failed`,
# nên bước gộp cuối vẫn chạy bình thường.
#
# Đây là mô hình router: một quyết định ở đầu quyết định hình dạng phần còn lại,
# thay vì nhét cả hai đường vào một prompt rồi hy vọng agent chọn đúng.
name: branch-by-answer
description: >-
  Phân nhánh theo câu trả lời: hotfix đi đường ngắn (sửa + test + PR), feature đi đường đầy đủ
  (plan → impl → test → PR). Nhánh không chọn bị skip, không phải fail.
folder: auto
steps:
  - key: route
    type: agent
    title: Việc này là hotfix hay feature?
    agentName: docs-planner
    permissionMode: default
    instruction: >-
      Đọc goal của run, đọc sơ code/spec liên quan, rồi gọi workflow_ask đúng MỘT câu:
      key "scope", kind "choice", options ["hotfix", "feature"], câu hỏi nói rõ bạn nghiêng về
      phương án nào và vì sao. "hotfix" = đã biết nguyên nhân, sửa tối thiểu; "feature" = cần đọc
      spec và lên plan trước. Đừng tự chọn thay người.

  - key: plan
    type: agent
    title: Plan (chỉ khi là feature)
    agentName: docs-planner
    dependsOn: [route]
    condition: answers.scope == "feature"
    permissionMode: default
    instruction: Đọc spec liên quan, viết plan ra docs/plans/, lưu bằng workflow_emit_artifact.

  - key: impl-feature
    type: agent
    title: Impl theo plan
    agentName: fe-dev
    dependsOn: [plan]
    condition: answers.scope == "feature"
    permissionMode: acceptEdits
    instruction: Impl đúng phạm vi trong plan.

  - key: impl-hotfix
    type: agent
    title: Sửa thẳng (hotfix)
    agentName: fe-dev
    dependsOn: [route]
    condition: answers.scope == "hotfix"
    permissionMode: acceptEdits
    instruction: >-
      Tìm nguyên nhân gốc rồi sửa tối thiểu — đừng vá triệu chứng cho test xanh, và đừng bó kèm
      refactor. Viết một test chống tái phát: nó phải đỏ trên code trước khi sửa.

  - key: verify
    type: gate
    title: Test phải xanh
    commandName: Test
    dependsOn: [impl-feature, impl-hotfix]
    onFail: impl-hotfix
    maxLoops: 2

  - key: pr
    type: agent
    title: Mở PR
    agentName: fe-dev
    dependsOn: [verify]
    permissionMode: acceptEdits
    instruction: Commit, mở PR, mô tả nói rõ đây là hotfix hay feature. KHÔNG merge.
