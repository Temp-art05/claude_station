# Parallel — voting: chạy CÙNG một việc nhiều lần rồi lấy đồng thuận.
#
# Khác `review-swarm` ở chỗ căn bản: swarm chia việc theo góc nhìn (mỗi con soát
# một khía cạnh khác nhau), còn đây ba con làm ĐÚNG một việc giống nhau. Lý do là
# thống kê chứ không phải phân công — một lượt agent có thể bỏ sót, ba lượt cùng
# bỏ sót một chỗ thì ít khả năng hơn hẳn.
#
# Dùng khi: bỏ sót đắt hơn chạy thừa — soát bảo mật trước release, soát regression
# cho một thay đổi chạm nhiều nơi, review một PR lớn.
# Không dùng khi: việc có đáp án đúng/sai máy kiểm được — lúc đó một gate rẻ hơn
# ba lượt agent.
name: voting-review
description: >-
  Ba lượt soát độc lập cùng một phạm vi, rồi gộp theo đồng thuận: chỗ cả ba cùng nói là chắc, chỗ chỉ
  một con nói được đánh dấu là cần kiểm lại. Dùng khi bỏ sót đắt hơn chạy thừa.
folder: auto
inputs:
  - key: scope
    label: Soát cái gì
    type: text
    required: true
    help: 'VD: "diff của branch hiện tại so với main", hoặc "toàn bộ module thanh toán".'

steps:
  - key: setup
    type: agent
    title: Chốt phạm vi chung
    agentName: fe-dev
    permissionMode: default
    instruction: >-
      Phạm vi: {{scope}}. Liệt kê chính xác file/diff nằm trong phạm vi và ghi ra artifact.
      Ba lượt soát sau đều dùng đúng danh sách này — chúng phải soát cùng một thứ thì phiếu mới so
      được với nhau.

  - key: vote-1
    type: agent
    title: Lượt soát 1
    agentName: fe-dev
    dependsOn: [setup]
    isolate: true
    permissionMode: default
    instruction: >-
      Soát độc lập phạm vi trong artifact. Tìm lỗi thật: sai logic, điều kiện biên, race, lỗi không
      xử lý, rò rỉ dữ liệu. Mỗi phát hiện kèm file:line và một kịch bản cụ thể khiến nó hỏng.
      Đừng đọc kết quả của lượt khác. Ghi ra artifact.

  - key: vote-2
    type: agent
    title: Lượt soát 2
    agentName: fe-dev
    dependsOn: [setup]
    isolate: true
    permissionMode: default
    instruction: >-
      Như lượt 1, làm độc lập: soát phạm vi trong artifact, mỗi phát hiện kèm file:line và kịch bản
      hỏng. Ghi ra artifact.

  - key: vote-3
    type: agent
    title: Lượt soát 3
    agentName: fe-dev
    dependsOn: [setup]
    isolate: true
    permissionMode: default
    instruction: >-
      Như lượt 1, làm độc lập: soát phạm vi trong artifact, mỗi phát hiện kèm file:line và kịch bản
      hỏng. Ghi ra artifact.

  - key: tally
    type: agent
    title: Gộp phiếu
    agentName: fe-dev
    dependsOn: [vote-1, vote-2, vote-3]
    permissionMode: acceptEdits
    instruction: >-
      Đọc ba artifact. Gộp các phát hiện trùng nhau (cùng file:line, cùng nguyên nhân) và ghi rõ
      mỗi cái được mấy trên ba lượt.
      Xếp làm ba nhóm: **3/3 — gần như chắc chắn**, **2/3 — nhiều khả năng**, **1/3 — cần người kiểm
      lại** (một lượt nói không có nghĩa là sai, cũng không có nghĩa là đúng).
      Không tự quyết bỏ nhóm 1/3 đi. Ghi báo cáo ra artifact.
