# Nhóm `jira` — từ spec ra ticket, không đụng code.
#
# Nhận MỘT HOẶC NHIỀU link spec GitHub (dán nhiều link cách nhau bằng dấu cách
# hoặc xuống dòng — server đọc hết trước khi step đầu chạy), chia task, rồi tạo
# ticket vào sprint. Sprint chọn trong danh sách đang mở, hoặc gõ tên mới thì nó
# tự tạo.
#
# Dùng khi: đầu sprint, có vài tài liệu spec, muốn ra board trước khi ai làm gì.
# Không dùng khi: chỉ có một spec và muốn code luôn → dùng workflow nhóm fe/ios.
#
# Chạy lại trên cùng spec KHÔNG tạo ticket trùng: jira-pm bắt buộc tra ticket
# đang mở trước, cái nào đã có thì dùng lại.
name: specs-to-jira
description: >-
  Một hoặc nhiều spec GitHub → chia task → tạo ticket Jira vào sprint (chọn sprint đang có hoặc tạo
  mới). Không đụng code. Chạy lại không tạo trùng.
folder: jira
inputs:
  - key: specs
    label: Spec (một hoặc nhiều link GitHub)
    type: docs
    required: true
    help: Dán nhiều link cách nhau bằng dấu cách hoặc xuống dòng. Nội dung được đọc sẵn cho step đầu.
  - key: jiraProject
    label: Jira project
    type: jira-project
    required: true
  - key: sprint
    label: Sprint
    type: jira-sprint
    help: 'Chọn sprint đang mở, hoặc gõ tên mới để tạo. Bỏ trống thì ticket nằm ở backlog.'
  - key: parentTicket
    label: Ticket cha (tuỳ chọn)
    type: jira-ticket
    help: Có ticket cha thì task tạo ra là subtask dưới nó.
steps:
  - key: read-specs
    type: agent
    title: 'Đọc spec, ra plan chia task'
    agentName: spec-reader
    permissionMode: bypassPermissions
    instruction: >-
      Toàn bộ spec ở {{specs}} đã nằm sẵn trong phần "Tagged sources" — đọc ngay ở đó, đừng đi tìm
      lại. Có nhiều spec thì đọc hết rồi nói rõ chỗ nào chồng lấn hoặc mâu thuẫn giữa chúng; đây là
      thứ dễ sót nhất khi chia task từ nhiều tài liệu. Soát đủ bốn mục (tiêu chí nghiệm thu kiểm
      được · bốn trạng thái loading/rỗng/lỗi/mất mạng · dùng API nào · lần này không làm gì), đối
      chiếu code hiện tại. Ra danh sách task: mỗi task xong-là-kiểm-được, một người làm trong một
      lần ngồi, nói rõ chờ task nào, và ghi rõ phần KHÔNG làm. Thiếu tiêu chí nghiệm thu thì nói ra
      chứ đừng tự đặt hộ PO. Lưu plan bằng workflow_emit_artifact.
  - key: create-tickets
    type: agent
    title: Tạo ticket vào sprint (bỏ qua cái đã có)
    agentName: jira-pm
    dependsOn:
      - read-specs
    permissionMode: bypassPermissions
    instruction: >-
      Đọc plan ở artifact. TRƯỚC KHI TẠO: jira_search ticket đang mở trong {{jiraProject}} (và dưới
      {{parentTicket}} nếu có) — task nào đã có rồi thì dùng lại, không tạo lại. Tạo phần còn lại
      trong project {{jiraProject}} (subtask dưới {{parentTicket}} nếu có). Sprint "{{sprint}}":
      jira_ensure_sprint rồi jira_add_to_sprint cho cả ticket mới lẫn ticket cũ thuộc đợt này.
      Sprint để trống thì ticket nằm backlog — nói rõ ra. Kết thúc: báo bằng số (tạo mới mấy, dùng
      lại mấy, vào sprint nào) và lưu bảng khoá ticket → tiêu đề → phụ thuộc bằng
      workflow_emit_artifact.
    readOnly: true
  - key: review-board
    type: manual
    title: Xem lại board
    dependsOn:
      - create-tickets
    instruction: Mở board và đọc lại. Ổn thì chạy workflow nhóm fe / ios / fe-be / ios-be cho từng ticket.
